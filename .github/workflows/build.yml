name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write          # to publish the APK as the "latest" release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ShackLink-PTT.apk
      - uses: actions/upload-artifact@v4
        with: { name: ShackLink-PTT-apk, path: ShackLink-PTT.apk }
      # Fixed download link for the phone:
      #   https://github.com/<owner>/<repo>/releases/latest/download/ShackLink-PTT.apk
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ShackLink-PTT.apk --title "ShackLink PTT (latest build)" --notes "Built from ${GITHUB_SHA::7}, versionCode=$((100 + GITHUB_RUN_NUMBER)). In the app: Check for update. First install: open it once; Sonim: Settings > Programmable Keys > Select PTT Key App > ShackLink PTT."
